name: Calculator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f calculator.css
          test -f calculator.js

      - name: Check calculator HTML
        run: |
          grep -q '<title>Calculator</title>' index.html
          grep -q 'id="current-display"' index.html

      - name: Check calculator JavaScript
        run: |
          grep -q '^function calculate()' calculator.js
          grep -q 'function addNumber' calculator.js
          grep -q 'function chooseOperator' calculator.js